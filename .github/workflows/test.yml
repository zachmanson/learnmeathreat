# Runs the full test suite on every push and pull request. This is a check
# only: Cloudflare Workers Builds still does the deploy from its own build,
# so a failing run here flags a problem but does not block the deploy.
name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
